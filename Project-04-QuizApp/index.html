<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUIZ App</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <div class="d-flex align-items-baseline gap-2 mb-3 px-1">
      <div class="logo">Quiz<em>App</em></div>
    </div>
    <div class="card">
      <div id="welcome" class="screen active">
        <span class="welcome-icon">🧠</span>
        <h1 class="welcome-title">Test Your <span>Knowledge</span></h1>
        <p class="welcome-desc">10 questions across science, history, geography & more. Answer fast you only have 20
          seconds per question!</p>
        <div class="stats-row">
          <div class="stat-chip"><strong>10</strong> Questions</div>
          <div class="stat-chip"><strong>20s</strong> Timer</div>
          <div class="stat-chip"><strong>4</strong> Options</div>
          <div class="stat-chip">Mixed Topics</div>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn-primary-custom" id="startBtn">Start Quiz →</button>
        </div>
      </div>

      <div id="quiz" class="screen">
        <div class="quiz-topbar">
          <div class="qnum">Question <strong id="qNum">1</strong> / 10</div>
          <div class="score-pill">Score <strong id="scoreVal">0</strong></div>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
        <div class="timer-row">
          <span class="timer-label">Time</span>
          <span class="timer-num" id="timerNum">20</span>
          <div class="timer-bar-wrap">
            <div class="timer-bar-fill" id="timerFill"></div>
          </div>
        </div>
        <div class="question-body">
          <div class="question-text" id="questionText"></div>
        </div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <div class="next-wrap">
          <button class="btn-next" id="nextBtn">Next Question →</button>
        </div>
      </div>
      <div id="result" class="screen">
        <span class="result-emoji" id="resultEmoji">🎉</span>
        <h2 class="result-heading" id="resultHeading">Well Done!</h2>
        <div class="result-grade-badge" id="resultGrade">Grade: A</div>
        <div class="score-display">
          <div class="score-big" id="scoreNum">0</div>
          <div class="score-total">/10</div>
        </div>
        <div class="res-stats">
          <div class="res-stat">
            <div class="res-stat-val" id="resCorrect">0</div>
            <div class="res-stat-lbl">Correct</div>
          </div>
          <div class="res-stat">
            <div class="res-stat-val" id="resWrong">0</div>
            <div class="res-stat-lbl">Wrong</div>
          </div>
          <div class="res-stat">
            <div class="res-stat-val" id="resPct">0%</div>
            <div class="res-stat-lbl">Accuracy</div>
          </div>
        </div>
        <div class="d-flex justify-content-center">
          <button class="btn-restart" id="restartBtn">↺ Play Again</button>
        </div>
      </div>

    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
