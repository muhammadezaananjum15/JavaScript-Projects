<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-effects">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-grid"></div>
  </div>
  <div class="wrapper">
    <div class="card">
      <div class="header">
        <div class="badge">
          <span class="badge-dot"></span>
           Your Password Security Tool
        </div>
        <h1>Password <em>Generator</em></h1>
        <p class="subtitle">Make your unsecure password to secure in few seconds</p>
      </div>

      <div class="output-wrap">
        <div class="output">
          <div class="output-inner">
            <div class="output-label">Generated Password</div>
            <div id="password">Click to Generate Secure Passwords</div>
          </div>
          <button class="copy-btn" onclick="copyPassword()" title="Copy to clipboard">
        <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>

      <div class="strength-row">
        <div class="strength-bars">
          <div class="strength-bar" id="bar1"></div>
          <div class="strength-bar" id="bar2"></div>
          <div class="strength-bar" id="bar3"></div>
          <div class="strength-bar" id="bar4"></div>
        </div>
        <p id="strength-msg"></p>
      </div>

      <hr class="divider">

      <div class="slider-header">
        <span class="section-label">Length</span>
        <span id="len-num">16</span>
      </div>
      <input type="range" id="length" min="4" max="64" value="16" oninput="updateLength()">

      <div class="checks-header">
        <span class="section-label">Character Types</span>
      </div>

      <div class="checks">
        <label class="check-item active" id="box-upper">
          <input type="checkbox" id="upper" checked>
          <div class="dot"></div>
          <span class="check-label">Uppercase</span>
          <span class="icon">Aa</span>
        </label>
        <label class="check-item active" id="box-lower">
          <input type="checkbox" id="lower" checked>
          <div class="dot"></div>
          <span class="check-label">Lowercase</span>
          <span class="icon">aa</span>
        </label>
        <label class="check-item active" id="box-nums">
          <input type="checkbox" id="nums" checked>
          <div class="dot"></div>
          <span class="check-label">Numbers</span>
          <span class="icon">01</span>
        </label>
        <label class="check-item active" id="box-syms">
          <input type="checkbox" id="syms" checked>
          <div class="dot"></div>
          <span class="check-label">Symbols</span>
          <span class="icon">@#</span>
        </label>
      </div>

      <button class="generate" onclick="generatePassword()">
        <div class="btn-inner">
      <i class="fas fa-sun"></i>
          Generate Password
        </div>
      </button>

    </div>
  </div>

  <div id="toast">✓ Copied to clipboard</div>

  <script src="app.js">

  </script>
</body>

</html>
