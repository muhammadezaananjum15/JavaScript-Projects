<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock & Stopwatch</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link
  href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap"
  rel="stylesheet" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <div class="site-header">
      <h1>DIGITAL CLOCK & STOPWATCH</h1>
      <p>Pakistan Standard Time</p>
    </div>
  <div class="panel">
    <div class="panel-label">Digital Clock</div>
    <div class="clock-display">
      <span id="clockH">00</span><span class="colon">:</span>
      <span id="clockM">00</span><span class="colon">:</span>
      <span id="clockS">00</span>
      <span class="ampm-badge" id="ampm">AM</span>
    </div>
    <div class="date-display " id="dateDisplay">Loading...</div>
  </div>
          <div class="panel">
      <div class="panel-label">Stopwatch</div>
      <div class="sw-display">
        <span class="sw-main">
          <span id="swM">00</span><span class="sw-sep">:</span><span id="swS">00</span>
        </span>
        <span class="sw-dot">.</span><span class="sw-ms" id="swMs">00</span>
      </div>
      <div class="btn-row">
        <button class="sw-btn btn-start" id="btnStart">Start</button>
        <button class="sw-btn btn-stop" id="btnStop" disabled>Stop</button>
        <button class="sw-btn btn-reset" id="btnReset">Reset</button>
      </div>
    </div>
  </div>
  <script src="app.js">
 </script>
</body>
</html>
