<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO App
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrapper">
  <div class="app-card">
    <div class="app-header">
      <div>
        <h1 class="app-title">TODO -- APP</h1>
      </div>
      <div class="task-counter" id="counter"><b>0</b>&nbsp;tasks</div>
    </div>
    <div class="app-body">
      <div class="search-row">
        <div class="search-wrap">
          <i class="fas fa-search si"></i>
          <input type="text" id="searchField" placeholder="Search tasks..." autocomplete="off" />
        </div>
        <button id="searchBtn"><i class="fas fa-search"></i> Search</button>
      </div>
      <div class="divider"></div>
      <div class="add-row">
        <input type="text" id="todoInput" placeholder="Type a new task..." autocomplete="off" />
        <button id="addBtn">+ Add</button>
      </div>
      <div class="section-label">Tasks</div>
      <ul id="todoList"></ul>
      <div id="emptyState" class="show">
        <div class="et">No tasks yet</div>
      </div>
    </div>
    <div class="app-footer">
      <button id="clearBtn">Clear all</button>
    </div>
  </div>
</div>
</body>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
  integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
  integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</html>
